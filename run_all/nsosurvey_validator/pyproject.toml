[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nsosurvey-validator"
version = "1.0.0"
description = "NSO Survey Data Validation Platform using probabilistic and machine learning techniques"
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.4",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "sqlalchemy>=2.0.31",
    "redis>=5.0.1",
    "aiokafka>=21.1.0",
    "dash>=2.18.0",
    "plotly>=5.22.1",
    "pyyaml>=6.0.1",
    "structlog>=23.3.0",
    "tqdm>=4.66.2",
]

extras = {
    "dev": [
        "pytest>=8.3.1",
        "pytest-asyncio>=0.23.3",
        "black>=24.0.0",
        "ruff>=0.10.0",
    ],
}

projectscripts = {
    "start": "uvicorn main:app --host 0.0.0.0 --port 8000",
    "dashboard": "python dash_dashboard.py",
}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.entry-points.console_scripts]
nsosurvey-start = "app.main:app_main"